name: Render Rome Episodes (HyperFrames)

on:
  workflow_dispatch:
    inputs:
      quality:
        description: 'Render Quality'
        required: true
        default: 'draft'
        type: choice
        options:
          - draft
          - high

jobs:
  render_episodes:
    name: Render Episode ${{ matrix.episode }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # Remaining 8 episodes to render in parallel
        episode: [4, 5, 6, 7, 8, 9, 10, 11]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install HyperFrames CLI & Browser Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-liberation
          npm install -g hyperframes@0.8.198
          npx playwright install-deps chromium
          hyperframes browser ensure

      - name: Render Episode ${{ matrix.episode }}
        run: |
          cd "RomeDocumentary/rome_ep${{ matrix.episode }}"
          hyperframes render --quality ${{ github.event.inputs.quality || 'draft' }} --output "../../rome_ep${{ matrix.episode }}_silent.mp4"

      - name: Upload Rendered Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rome_ep${{ matrix.episode }}_silent
          path: rome_ep${{ matrix.episode }}_silent.mp4
          retention-days: 7
